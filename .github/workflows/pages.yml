# Test, build the static search site from data/ and geo/, and publish it on GitHub Pages.
# The built site (~8k listing buckets, data/l/*.json.zst) is never committed; every push to main rebuilds it.
# data/<pref>/ comes from the snapshot data/snapshot.json names (a release asset: .github/scripts/data.sh); a missing
# or bad one fails the build, and Pages keeps serving the last deployment. The front-end job (workflow and shell lint,
# JS lint, the headless-browser smoke test) runs alongside the build; deploy needs both.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false  # let a running deployment finish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (runs site/filter.js in tests)
        with:
          node-version: 22
      - name: Lint and test
        run: |
          uv run ruff check suumo tests
          uv run pytest -q
      - name: Data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/data.sh get data
      - name: Build site
        run: uv run python -m suumo site --out _site
      - name: Site size (Pages refuses an artifact over 1 GB)
        run: |
          total=$(tar -cf - -C _site . | wc -c)
          records=$(du -sk _site/data/l | cut -f1)
          files=$(find _site -type f | wc -l)
          mb=$((total / 1000000))
          {
            echo "### Site size"
            echo "| | |"
            echo "|---|---|"
            echo "| artifact (tar) | ${mb} MB of 1000 |"
            echo "| listing records (data/l) | $((records / 1000)) MB |"
            echo "| files | ${files} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 950 ]; then echo "::error::site is ${mb} MB: over 950 MB, Pages' limit is 1 GB"; exit 1; fi
          if [ "$mb" -gt 800 ]; then echo "::warning::site is ${mb} MB: over 800 MB (Pages' limit is 1 GB)"; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT: "1.65.2"  # pinned: the smoke test's driver and its browser build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: Workflow and shell lint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          shellcheck .github/scripts/*.sh
      - name: JS lint (biome.json)
        run: |
          npx --yes @biomejs/biome@2.6.9 lint --reporter=github
          # the page's ES modules from stdin as modules: Node 22's --check passes a file with import/export
          # syntax without checking it; the classic scripts (filter.js, i18n.js, sw.js, vendored) as they are
          for f in site/*.js; do
            if grep -qE '^(import|export) ' "$f"; then node --input-type=module --check < "$f" || { echo "::error file=$f::syntax"; exit 1; }
            else node --check "$f"; fi
          done
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT }}
      - name: Smoke test (tests/test_smoke.py)
        run: |
          uv run --with "playwright==$PLAYWRIGHT" playwright install --with-deps --only-shell chromium
          uv run --with "playwright==$PLAYWRIGHT" pytest tests/test_smoke.py -q

  deploy:
    needs: [build, frontend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
