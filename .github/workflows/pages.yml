# Test, build the static search site from data/ and geo/, and publish it on GitHub Pages.
# The built site (~60k listing files) is never committed; every push to main rebuilds it.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false  # let a running deployment finish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (runs site/filter.js in tests)
        with:
          node-version: 22
      - name: Lint and test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          uv run ruff check suumo tests
          uv run pytest -q
      - name: Build site
        run: uv run python -m suumo site --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
