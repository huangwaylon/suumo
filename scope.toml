# What to crawl. Add an entry and the next `run` baselines it silently, then queues its listing pages.
# pref: SUUMO slug (tokyo, chiba, kanagawa, ...). types: omit for all five. areas: omit for the whole prefecture.
# Area codes are JIS municipality codes (e.g. 13219 = 狛江市); see data/<pref>/areas.json after a run.

[[scope]]
pref = "tokyo"   # all 62 municipalities, all five types

[[scope]]
pref = "gumma"   # 群馬 (SUUMO's slug); crawled in turn with the other prefectures around Tokyo
rotate = true
