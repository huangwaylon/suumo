<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>物件さがし</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b4cca'/><path d='M8 16l8-7 8 7v8h-5v-5h-6v5H8z' fill='white'/></svg>">
  <script>
    // Theme and language before the first paint (no flash): saved settings, else the system's.
    (() => {
      let s = {};
      try { s = JSON.parse(localStorage.getItem("suumo.settings") || "{}"); } catch {}
      const dark = s.theme === "dark" || (s.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      if (s.lang) document.documentElement.lang = s.lang;
    })();
  </script>
  <link rel="preload" href="data/index.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js" defer></script>
  <script src="filter.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#list" data-t="skip"></a>
  <a class="skip" href="#map" data-t="skipMap"></a>
  <header class="bar">
    <a class="brand" href="#" data-t="brand"></a>
    <label class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" data-t-placeholder="search" data-t-label="searchLabel" autocomplete="off" enterkeyhint="search">
    </label>
    <button id="filters-open" class="icon-btn" data-t-label="filtersOpen">
      <svg class="i"><use href="#i-sliders"/></svg><span class="badge" id="filters-n" hidden></span>
    </button>
    <button id="favs" class="icon-btn" data-t-label="favorites" aria-pressed="false">
      <svg class="i"><use href="#i-heart"/></svg><span class="badge" id="favs-n" hidden></span>
    </button>
    <button id="settings-open" class="icon-btn" data-t-label="settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <div class="layout">
    <aside id="filters" class="filters" data-t-label="filters">
      <div class="sheet-head">
        <h2 data-t="filters"></h2>
        <button id="filters-close" class="icon-btn" data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="filters-body" class="sheet-body"></div>
      <div class="filters-foot">
        <button id="clear" class="btn ghost" data-t="clearAll"></button>
        <button id="apply" class="btn primary"></button>
      </div>
    </aside>

    <main class="results">
      <div class="toolbar">
        <strong id="count" aria-live="polite"></strong>
        <select id="sort" class="select" data-t-label="sort"></select>
      </div>
      <div id="chips" class="chips"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="list" class="grid"></div>
      <div id="sentinel"></div>
    </main>

    <section id="map" class="map" data-t-label="map"></section>
  </div>

  <button id="view" class="fab"></button>

  <div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-panel">
      <div class="detail-top">
        <button id="detail-back" class="btn ghost"><svg class="i"><use href="#i-back"/></svg><span data-t="back"></span></button>
      </div>
      <div id="detail-body" class="detail-body"></div>
      <div class="detail-actions">
        <button id="detail-fav" class="btn" aria-pressed="false"><svg class="i"><use href="#i-heart"/></svg><span></span></button>
        <a id="detail-link" class="btn primary" target="_blank" rel="noopener"><span data-t="openSuumo"></span><svg class="i"><use href="#i-external"/></svg></a>
      </div>
    </div>
  </div>

  <div id="settings" class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="settings-panel">
      <div class="sheet-head">
        <h2 id="settings-title" data-t="settings"></h2>
        <button id="settings-close" class="icon-btn" data-t-label="close"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="settings-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-5 2v14l5-2 6 2 5-2V4l-5 2-6-2zM9 4v14M15 6v14"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    </defs>
  </svg>
</body>
</html>
