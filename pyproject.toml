[project]
name = "suumo"
version = "0.3.0"
description = "Track SUUMO for-sale listings and publish them as a searchable site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.uv]
package = false  # an application run with `python -m suumo`, not an installed package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
