[project]
name = "suumo-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
